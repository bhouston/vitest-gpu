name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [22, 26]
    env:
      # Software rasterizers on GPU-less runners: Mesa llvmpipe for WebGL, Dawn's Vulkan backend on lavapipe for WebGPU.
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2 libgl1-mesa-dri mesa-vulkan-drivers
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm tsc
      - run: pnpm test:types
      - run: pnpm lint
      - name: Check formatting
        run: pnpm exec oxfmt --check .
      - run: pnpm test --coverage
      # --- repository-specific steps (package-content check, size budget, e2e, docs, ...) go here ---
      - run: pnpm test:workflow
      - run: pnpm package:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            coverage/
            **/__screenshots__/*.actual.png
            **/__screenshots__/*.diff.png
          if-no-files-found: ignore
      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: pnpm audit --audit-level=high
      - name: Flag audit findings
        if: steps.audit.outcome == 'failure'
        run: echo '::warning::Dependency audit found vulnerabilities or could not reach the registry. Review the audit step.'
      - uses: codecov/codecov-action@v5
        if: ${{ !cancelled() && runner.os == 'macOS' && matrix.node == 26 && hashFiles('coverage/lcov.info') != '' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

  vitest-compat:
    name: vitest ${{ matrix.vitest }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # vitest 3 is intentionally excluded: vitest-environment-webgl-node and
        # vitest-environment-webgpu-node only implement the `viteEnvironment` custom
        # environment hook (vitest >=4); vitest 3 only understands the removed
        # `transformMode` hook, so it cannot load either environment at all.
        vitest: [4, 5]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2 libgl1-mesa-dri mesa-vulkan-drivers
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Override the workspace to vitest ${{ matrix.vitest }}
        # A pnpm override (not `pnpm add -D -w`) so every workspace member -- including demo/package.json's
        # own pinned vitest devDependency -- resolves the matrix version, not just the root.
        run: |
          printf 'overrides:\n  vitest: "%s"\n  "@vitest/coverage-v8": "%s"\n' "$V" "$V" >> pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile
        env:
          V: ${{ matrix.vitest }}
      - run: pnpm test
