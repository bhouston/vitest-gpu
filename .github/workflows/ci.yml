name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [22, 26]
    env:
      # Software rasterizers on GPU-less runners: Mesa llvmpipe for WebGL, Dawn's Vulkan backend on lavapipe for WebGPU.
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v6
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2 libgl1-mesa-dri mesa-vulkan-drivers
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:workflow
      - run: pnpm lint
      - run: pnpm tsc
      - run: pnpm test:coverage
      - run: pnpm audit --audit-level=high
      - run: pnpm package:check
      - uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            coverage/
            **/__screenshots__/*.actual.png
            **/__screenshots__/*.diff.png
      - name: Upload coverage
        if: runner.os == 'macOS' && matrix.node == 26
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  policy:
    name: PR policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate PR title and workflow
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_REPO: ${{ github.repository }}
        run: |
          printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
          node scripts/check-pr-policy.mjs
