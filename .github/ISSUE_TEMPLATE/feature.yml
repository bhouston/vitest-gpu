name: Feature or improvement
description: Propose a change before implementation.
title: 'feat: '
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should change and why?
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: List observable outcomes as checkboxes.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Compatibility, scope, and implementation constraints.
